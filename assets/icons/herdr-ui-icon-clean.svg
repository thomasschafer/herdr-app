<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Herdr</title>
  <desc id="desc">Herdr's ram and terminal prompt glowing in cream phosphor on a dark screen, framed by a graphite bezel.</desc>
  <metadata>Ram path adapted from https://github.com/herdrdev/herdr/blob/HEAD/assets/logo.svg. Upstream project license: Apache-2.0. Preserve upstream attribution and applicable notices when distributing.</metadata>
  <defs>
    <path id="ram" d="M540.8 224 c-25.8 6.6 -59.8 27 -71.8 42.8 -4.2 5.6 -5.2 8.4 -4.2 12.6 1.8 7.6 30.8 35.6 39.8 38.4 6.4 2.2 8.2 1.8 20.8 -4.6 34.2 -17.2 70.8 -14 95 8.6 30 27.6 30 75.8 0 102.2 -21.4 19 -55.6 18.8 -77.2 -0.4 l-9.2 -8 -2.2 5.8 c-3.2 8 -2.8 24.4 0.8 32.8 12 28.8 52.8 44.4 90.4 34.8 72 -18.4 111.8 -98.8 86 -173.6 -7.2 -20.6 -16.2 -34.6 -35 -53.4 -14.2 -14.4 -20 -18.6 -36 -26.4 -10.4 -5.2 -25.4 -10.8 -33.4 -12.4 -19.2 -4.2 -46 -4 -63.8 0.8z M418.6 227 c-23.2 6.4 -44.2 21.6 -54.6 39.8 -3.4 5.6 -6 10.8 -6 11.6 0 0.8 4 -0.2 9 -2.4 13.2 -5.6 44 -13.6 58.8 -15.2 12.8 -1.4 13 -1.4 27.4 -16.6 8 -8.2 14.2 -15.4 13.8 -15.8 -0.4 -0.4 -4.2 -1.6 -8.4 -2.6 -11 -2.4 -28 -2 -40 1.2z M424.4 288.4 c-31.8 4.4 -78 24.4 -111.8 48.2 -59.8 42 -117 120 -121.8 165.6 -2.4 23.6 8 50.2 25 63.6 19.2 15.2 35.6 19.6 85.2 23.2 22 1.6 44.8 4.2 50.8 5.8 25 6.8 46 23 54.4 42.2 2.2 4.8 4.8 16.2 6 25.4 4 34 13 54.2 33.2 74.8 6.8 7 12.6 13 12.6 13.4 0 0.2 -2 5.4 -4.4 11.4 -5.8 15.2 -7.4 51.8 -2.8 70 8.4 34 31.6 63.6 62.2 79.4 8.8 4.6 19.6 9.2 24 10.4 4.4 1.2 9 2.8 10.2 3.6 1 1 3 9.6 4.4 19.2 1.2 9.6 2.8 18.4 3.4 19.4 0.8 1.2 83 2 226.2 2 l224.8 -0 0 -316.8 0 -317 -11 3.8 c-16.8 5.8 -28.6 13.6 -46.4 30.8 l-16.6 15.6 -10.8 -9.8 c-22.2 -20.4 -46.6 -30.2 -78.2 -32 -22.6 -1.2 -39.8 2 -59.6 10.8 l-12 5.4 -5.2 -6.8 c-7.4 -10.2 -24 -26.8 -25.4 -25.6 -0.6 0.8 0 6.8 1.4 13.4 3.4 17.8 1.4 53.6 -4.2 71.2 -20.6 65.6 -75.4 109 -137.6 109 -32.2 -0 -54.6 -8.2 -74.6 -27.4 -7.4 -7 -13.2 -15 -17 -23.2 -15.8 -34.6 -1.6 -81.4 24.8 -81.4 8.8 -0 13.6 2.8 23.4 13.2 14.8 15.6 33.4 16.4 47.6 1.8 12 -12.4 14.4 -29.4 6.6 -46.2 -8.4 -18 -24 -26 -47.6 -24.4 -10 0.8 -17 2.8 -26.2 7.4 -17.8 9 -24.4 10.4 -35.2 8 -18.4 -4 -52.4 -32.6 -60.4 -50.6 -2.2 -5 -4.2 -9 -4.4 -9 -0.2 0.2 -6 1.2 -13 2.2z m-51.2 101 c23 17.6 25.8 20.4 26.4 26.2 0.4 3.6 -0.4 8 -1.8 9.8 -1.4 1.6 -13.8 11 -27.6 21 -20.6 14.6 -26 17.6 -30.2 16.6 -7 -1.6 -10.2 -6.8 -9.6 -14.8 0.6 -6.2 2.4 -8.4 16.6 -18.4 8.8 -6.2 16 -12.2 16.4 -13.2 0.2 -0.8 -6 -6.2 -13.8 -11.6 -7.8 -5.6 -15.4 -11.2 -17 -12.6 -3.6 -3.8 -3.2 -14.4 0.8 -18.8 6.4 -7 12.6 -4.6 39.8 15.8z m105.6 17.6 c4.6 4.8 5.6 10.4 2.8 16.4 l-2.6 5.6 -28.2 0.6 c-26 0.4 -28.4 0.2 -31.6 -3.4 -4.6 -5.2 -4.8 -13.2 -0.2 -18.2 3.2 -3.6 6.4 -4 30.2 -4 21 -0 27.2 0.6 29.6 3z" />
    <!-- The bezel follows the macOS icon grid: an 824px tile centred in 1024. -->
    <clipPath id="tile-clip">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
    <clipPath id="screen-clip">
      <rect x="140" y="140" width="744" height="744" rx="149" />
    </clipPath>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="near" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="far" />
        <feMergeNode in="near" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soften" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b8be" />
      <stop offset=".25" stop-color="#6e737a" />
      <stop offset=".7" stop-color="#4a4e55" />
      <stop offset="1" stop-color="#8d9198" />
    </linearGradient>
    <radialGradient id="screen" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#2b2216" />
      <stop offset="1" stop-color="#080604" />
    </radialGradient>
    <linearGradient id="phosphor" x1="0" y1="0" x2=".2" y2=".7">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#fff0d2" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16" />
      <stop offset=".45" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7" />
      <stop offset=".3" stop-color="#fff" stop-opacity=".2" />
      <stop offset="1" stop-color="#fff" stop-opacity=".35" />
    </linearGradient>
    <!-- Fades the ram's body into the dark so the head carries the icon. -->
    <radialGradient id="head-fade" cx="420" cy="400" r="500" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#fff" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="head-fade-mask">
      <rect width="1024" height="1024" fill="url(#head-fade)" />
    </mask>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="3.1" fill="#fff" />
    </pattern>
    <mask id="dots-mask">
      <rect width="1024" height="1024" fill="url(#dots)" />
    </mask>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#000" opacity=".28" />
    </pattern>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity=".45" filter="url(#drop-shadow)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bezel)" />
  <rect x="137" y="137" width="750" height="750" rx="152" fill="#050506" />
  <g clip-path="url(#screen-clip)">
    <rect x="140" y="140" width="744" height="744" fill="url(#screen)" />
    <g mask="url(#head-fade-mask)">
      <use href="#ram" fill="#fff0d2" opacity=".9" filter="url(#glow)" />
      <use href="#ram" fill="url(#phosphor)" mask="url(#dots-mask)" />
      <use href="#ram" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="4" />
    </g>
    <rect x="140" y="140" width="744" height="744" fill="url(#scanlines)" opacity=".6" />
    <rect x="140" y="140" width="744" height="744" rx="149" fill="none" stroke="#000" stroke-width="30" opacity=".6" filter="url(#soften)" />
  </g>
  <rect x="100" y="100" width="824" height="412" rx="185" fill="url(#gloss)" clip-path="url(#tile-clip)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3" />
</svg>
